<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Don't Block Me – Anime Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0d0b24;--card:#1a1740;--or:#ff8a1f;--yl:#ffd93b;--pk:#ff3d81;--tx:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif;overflow-x:hidden;
background-image:radial-gradient(rgba(255,138,31,.18) 1.5px,transparent 1.5px),repeating-conic-gradient(from 0deg at 50% 40%,rgba(255,61,129,.07) 0 6deg,transparent 6deg 12deg);background-size:18px 18px,100% 100%}
.bn{font-family:Bangers,Impact,sans-serif;letter-spacing:2px}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 30px;position:relative;min-height:100vh}
.logo{text-align:center;font-size:44px;line-height:1;margin:6px 0 0;color:var(--yl);text-shadow:3px 3px 0 var(--pk),6px 6px 0 #000;transform:rotate(-2deg)}
.sub{text-align:center;font-size:13px;opacity:.85;margin:10px 0}
.hero{position:relative;height:230px;margin:6px 0}
.hero img{position:absolute;bottom:0;height:100%;max-width:55%;object-fit:contain;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4));animation:fl 3s ease-in-out infinite}
.hero .n{left:-4px}.hero .g{right:-4px;animation-delay:1.2s}
@keyframes fl{50%{transform:translateY(-8px)}}
.card{background:var(--card);border:3px solid var(--or);border-radius:18px;padding:18px;box-shadow:6px 6px 0 #000;position:relative}
h2{margin:0 0 10px;font-size:28px;color:var(--yl)}
input{width:100%;padding:13px 14px;border-radius:12px;border:3px solid #000;font:700 16px Poppins,sans-serif;margin:8px 0 12px;background:#fff;color:#111}
button{cursor:pointer;font:400 24px Bangers,Impact,sans-serif;letter-spacing:2px;color:#111;background:linear-gradient(var(--yl),var(--or));border:3px solid #000;border-radius:14px;padding:10px 18px;box-shadow:4px 4px 0 #000;width:100%;transition:transform .1s}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.opt{display:block;margin:9px 0;font:600 15px Poppins,sans-serif;letter-spacing:0;text-align:left;background:#fff;color:#111;padding:12px 14px}
.opt.ok{background:#3ddc84}.opt.no{background:var(--pk);color:#fff}
.bar{height:10px;background:#000;border-radius:9px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pk),var(--yl));transition:width .4s}
.q{font-size:17px;font-weight:700;margin:0 0 6px}
.score{font-size:64px;color:var(--yl);text-align:center;text-shadow:3px 3px 0 var(--pk)}
.verdict{text-align:center;font-size:30px;margin:0 0 6px}
.cr{text-align:center;margin-top:22px;font-size:13px}
.cr b{font-family:Bangers,Impact,sans-serif;letter-spacing:2px;font-size:20px;color:var(--yl);display:block;text-shadow:2px 2px 0 var(--pk)}

.talk{display:flex;align-items:center;gap:6px;margin:4px 0 16px}
.talk img{width:42%;max-width:190px;height:auto;filter:drop-shadow(0 5px 0 rgba(0,0,0,.45));animation:bob 2.2s ease-in-out infinite;flex:none}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.bub{position:relative;flex:1;min-height:84px;background:#fff;color:#111;border:3px solid #000;border-radius:20px;padding:12px 14px;font:700 14px/1.4 Poppins,sans-serif;box-shadow:4px 4px 0 #000;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.bub:before{content:"";position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid #000;border-left:0}
.bub:after{content:"";position:absolute;left:-9px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:11px solid #fff;border-left:0}
#tb:after{content:"\258C";color:var(--pk);animation:bl .7s steps(1) infinite;margin-left:1px}
@keyframes bl{50%{opacity:0}}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.bub.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-5px) rotate(-1deg)}75%{transform:translateX(5px) rotate(1deg)}}
.hid{display:none}
.mini{position:fixed;bottom:0;pointer-events:none;height:90px;opacity:.9}

/* ===== SPATIAL UI ===== */
:root{--rx:0deg;--ry:0deg;--lx:50%;--ly:35%;--px:0;--py:0;--edge:rgba(255,255,255,.3)}
body{background:radial-gradient(120% 70% at 50% 0%,#2b2073 0%,#0d0b24 62%) fixed}
.orb{position:fixed;border-radius:50%;filter:blur(55px);opacity:.5;pointer-events:none;z-index:0;transition:transform .3s ease-out;transform:translate3d(calc(var(--px)*var(--d)*1px),calc(var(--py)*var(--d)*1px),0)}
.ob1{width:280px;height:280px;left:-70px;top:6%;background:#ff3d81;--d:-34}
.ob2{width:330px;height:330px;right:-100px;top:38%;background:#6a5cff;--d:44}
.ob3{width:240px;height:240px;left:18%;bottom:-80px;background:#ff8a1f;--d:28}
.wrap{perspective:1100px;z-index:1}
.logo{transform:translateZ(60px) rotate(-2deg)}
.card{background:none;border:none;box-shadow:none;border-radius:28px;padding:22px;transform-style:preserve-3d;transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .2s ease-out;animation:rise .6s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes rise{from{opacity:0;transform:translateZ(-120px) rotateX(14deg)}}
.card:before{content:"";position:absolute;inset:0;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--edge);box-shadow:0 34px 60px -24px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.4)}
.card:after{content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;background:radial-gradient(circle at var(--lx) var(--ly),rgba(255,255,255,.3),transparent 45%);mix-blend-mode:soft-light;transform:translateZ(1px)}
.card>*{position:relative;transform:translateZ(24px);transform-style:preserve-3d}
.card h2{transform:translateZ(42px)}
.card>button{transform:translateZ(36px)}
.card>button:active{transform:translateZ(18px) scale(.97)}
button{font-family:Bangers,Impact,sans-serif;background:linear-gradient(135deg,var(--yl),var(--or));border:1px solid rgba(255,255,255,.55);border-radius:999px;box-shadow:0 12px 24px -8px rgba(255,138,31,.65),inset 0 1px 0 rgba(255,255,255,.65);color:#1a1030}
input{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:16px;box-shadow:inset 0 2px 8px rgba(0,0,0,.25)}
input::placeholder{color:rgba(255,255,255,.55)}
input:focus{outline:none;border-color:var(--yl);box-shadow:0 0 0 3px rgba(255,217,59,.3)}
.opt{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:18px;box-shadow:0 10px 20px -12px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s,background .2s,box-shadow .2s}
.opt:hover{transform:translateZ(16px);background:rgba(255,255,255,.18)}
.opt:active{transform:translateZ(6px) scale(.98)}
.opt.ok{background:rgba(61,220,132,.55);border-color:#3ddc84;box-shadow:0 0 26px rgba(61,220,132,.55)}
.opt.no{background:rgba(255,61,129,.55);border-color:var(--pk);box-shadow:0 0 26px rgba(255,61,129,.5)}
.bar{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2)}
.bar i{box-shadow:0 0 14px var(--pk)}
.bub{background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.7);border-radius:22px;box-shadow:0 18px 30px -14px rgba(0,0,0,.7)}
.bub:before{display:none}
.hero img,.talk img{filter:drop-shadow(0 14px 18px rgba(0,0,0,.5))}
@media (prefers-reduced-motion:reduce){.card,.orb{transition:none;animation:none}}

/* ===== V3: Ghibli scene, light vision, anime FX, glass dock ===== */
:root{--mx:50vw;--my:40vh}
.wrap{padding-top:64px}
.scene{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.cl{animation:drift 70s linear infinite}.c2{animation-duration:95s;animation-delay:-40s}.c3{animation-duration:120s;animation-delay:-80s}
@keyframes drift{from{transform:translateX(-170px)}to{transform:translateX(470px)}}
.orb{opacity:.32}
.card:before{background:linear-gradient(145deg,rgba(40,28,100,.55),rgba(20,12,60,.38))}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.dock{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:5px;border-radius:999px;background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);border:1px solid rgba(255,255,255,.35);box-shadow:0 14px 30px -12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.45)}
.gb{width:auto;display:flex;align-items:center;gap:7px;font:700 11px Poppins,sans-serif;letter-spacing:.8px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 13px;box-shadow:none;white-space:nowrap}
.gb:active{transform:scale(.95)}
.gb.on,.playing{background:rgba(255,217,59,.28);border-color:var(--yl);box-shadow:0 0 18px rgba(255,217,59,.45)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}.eq i{width:3px;height:4px;background:var(--yl);border-radius:2px}
.playing .eq i{animation:eq .8s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}
@keyframes eq{50%{height:14px}}
.chip{display:inline-block;padding:5px 12px;margin-bottom:8px;border-radius:999px;font:700 12px Poppins,sans-serif;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.hero:before{content:"";position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle,rgba(255,138,31,.45),transparent 65%);animation:aura 3s ease-in-out infinite}
@keyframes aura{50%{transform:scale(1.25);opacity:.55}}
.logo{animation:lg 3s ease-in-out infinite}
@keyframes lg{50%{filter:drop-shadow(0 0 14px rgba(255,217,59,.85))}}
#burst{position:fixed;left:50%;top:30%;z-index:15;pointer-events:none;font:400 76px Bangers,Impact,sans-serif;letter-spacing:3px;text-shadow:4px 4px 0 #000,0 0 30px currentColor;transform:translate(-50%,-50%) scale(0);white-space:nowrap}
#burst.go{animation:kapow .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes kapow{0%{transform:translate(-50%,-50%) scale(0) rotate(-12deg);opacity:1}30%{transform:translate(-50%,-50%) scale(1.15) rotate(-6deg)}70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}100%{opacity:0;transform:translate(-50%,-62%) scale(1.1) rotate(-6deg)}}
#speed{position:fixed;inset:0;z-index:14;pointer-events:none;opacity:0;--sl:255,255,255;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(var(--sl),.6) 0 1.2deg,transparent 1.2deg 6deg);-webkit-mask-image:radial-gradient(circle at 50% 45%,transparent 28%,#000 85%);mask-image:radial-gradient(circle at 50% 45%,transparent 28%,#000 85%)}
#speed.bad{--sl:255,61,129}
#speed.go{animation:sp .5s ease-out}
@keyframes sp{0%{opacity:.9;transform:scale(1.35)}100%{opacity:0;transform:scale(1)}}
.quake{animation:quake .4s}
@keyframes quake{20%{transform:translate(-7px,3px) rotate(-.6deg)}50%{transform:translate(7px,-3px) rotate(.6deg)}80%{transform:translate(-4px,2px)}}
#lv,#lvt,#lens{position:fixed;pointer-events:none;opacity:0;transition:opacity .45s}
#lv{inset:0;z-index:6;background:radial-gradient(circle 160px at var(--mx) var(--my),transparent 0,transparent 68%,rgba(4,2,20,.93) 100%)}
#lvt{inset:0;z-index:7;-webkit-mask-image:radial-gradient(circle 170px at var(--mx) var(--my),#000 35%,transparent 100%);mask-image:radial-gradient(circle 170px at var(--mx) var(--my),#000 35%,transparent 100%)}
#lvt span{position:absolute;font:400 26px Bangers,Impact,sans-serif;letter-spacing:2px;color:#ffe27a;text-shadow:0 0 14px #ffb300,0 0 30px #ff8a1f;transform:rotate(var(--r))}
#lens{left:var(--mx);top:var(--my);z-index:8;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:2px solid rgba(255,230,120,.95);box-shadow:0 0 34px 8px rgba(255,190,60,.55),inset 0 0 34px rgba(255,200,60,.45)}
#lens:before{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,226,122,.9),transparent 40%,rgba(255,61,129,.8),transparent 80%);-webkit-mask:radial-gradient(circle,transparent 66%,#000 68%,#000 72%,transparent 74%);mask:radial-gradient(circle,transparent 66%,#000 68%,#000 72%,transparent 74%);animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lv-on #lv,.lv-on #lvt,.lv-on #lens{opacity:1}
@media (prefers-reduced-motion:reduce){.cl,.hero:before,.logo{animation:none}}
</style></head><body>

// Picks ROUND random questions this person has NOT seen yet. When all are used up, it starts a fresh cycle.
function buildQuiz(){
 var all=[];for(var k=0;k<BANK.length;k++)all.push(k);
 var seen=getSeen().filter(function(x){return x<BANK.length});
 var pick=shuf(all.filter(function(x){return seen.indexOf(x)<0})).slice(0,ROUND);
 if(pick.length<ROUND){
  var rest=shuf(all.filter(function(x){return pick.indexOf(x)<0}));
  pick=pick.concat(rest.slice(0,ROUND-pick.length));seen=pick.slice();
 }else seen=seen.concat(pick);
 setSeen(seen);
 return pick.map(function(n){var r=BANK[n],o=shuf(r.slice(1));
  return{q:r[0].replace(/\{O\}/g,OWNER),o:o,a:o.indexOf(r[1])}});
}

// ===== Spatial tilt + parallax (pointer / touch-drag / device tilt) =====
(function(){
 if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 var r=document.documentElement.style;
 function aim(x,y){r.setProperty("--ry",(x*9).toFixed(2)+"deg");r.setProperty("--rx",(-y*9).toFixed(2)+"deg");
  r.setProperty("--lx",(50+x*40).toFixed(1)+"%");r.setProperty("--ly",(35+y*40).toFixed(1)+"%");
  r.setProperty("--px",x.toFixed(3));r.setProperty("--py",y.toFixed(3))}
 function c(v){return Math.max(-1,Math.min(1,v))}
 addEventListener("pointermove",function(e){aim(e.clientX/innerWidth*2-1,e.clientY/innerHeight*2-1)});
 document.addEventListener("pointerleave",function(){aim(0,0)});
 if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission!=="function")
  addEventListener("deviceorientation",function(e){if(e.gamma!=null&&e.beta!=null)aim(c(e.gamma/30),c((e.beta-45)/30))});
})();

// ===== V3: music, particles, anime FX, light vision =====
(function(){
 var $=function(x){return document.getElementById(x)},d=document.documentElement.style,calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
 // --- music (starts on START tap; button toggles) ---
 var bgm=$("bgm"),mb=$("mbtn"),off=false;bgm.volume=.55;
 function mus(on){if(on){var p=bgm.play();if(p)p.then(function(){mb.classList.add("playing")}).catch(function(){})}else{bgm.pause();mb.classList.remove("playing")}}
 mb.onclick=function(){off=!bgm.paused;mus(bgm.paused)};
 // --- particles: sakura + fireflies + sparkle bursts ---
 var fx=$("fx"),cx=fx.getContext("2d"),W=0,H=0,P=[],B=[];
 function rs(){var r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;fx.width=W*r;fx.height=H*r;cx.setTransform(r,0,0,r,0,0)}

 for(var n=0;n<26;n++)P.push({t:n%4?0:1,x:Math.random()*W,y:Math.random()*H,r:3+Math.random()*4,v:.4+Math.random()*.8,s:Math.random()*6.28,a:Math.random()*6.28});
 function burst(x,y,c){var cols=["#ffd93b","#ff3d81","#ffffff","#3ddc84","#6a5cff"];for(var k=0;k<c;k++)B.push({x:x,y:y,vx:(Math.random()-.5)*10,vy:(Math.random()-.9)*9,l:1,c:cols[k%5],r:2+Math.random()*3})}
 function loop(){cx.clearRect(0,0,W,H);
  P.forEach(function(p){p.s+=.02;
   if(!p.t){p.y+=p.v;p.x+=Math.sin(p.s)*.8+.3;p.a+=.03;if(p.y>H+10||p.x>W+10){p.y=-10;p.x=Math.random()*W}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle="rgba(255,183,206,.85)";cx.beginPath();cx.ellipse(0,0,p.r,p.r*.55,0,0,6.28);cx.fill();cx.restore()}
   else{p.x+=Math.sin(p.s)*.5;p.y+=Math.cos(p.s*.8)*.4;cx.globalAlpha=.35+.65*Math.abs(Math.sin(p.s*1.5));cx.shadowColor="#ffe27a";cx.shadowBlur=14;cx.fillStyle="#fff3a8";cx.beginPath();cx.arc(p.x,p.y,2.2,0,6.28);cx.fill();cx.shadowBlur=0;cx.globalAlpha=1}});
  for(var k=B.length-1;k>=0;k--){var b=B[k];b.x+=b.vx;b.y+=b.vy;b.vy+=.25;b.l-=.025;if(b.l<=0){B.splice(k,1);continue}
   cx.globalAlpha=b.l;cx.fillStyle=b.c;cx.shadowColor=b.c;cx.shadowBlur=10;cx.beginPath();cx.arc(b.x,b.y,b.r,0,6.28);cx.fill()}
  cx.globalAlpha=1;cx.shadowBlur=0;requestAnimationFrame(loop)}

 function word(t,c){var e=$("burst");e.textContent=t;e.style.color=c;replay(e,"go")}

  if(t>=80){word("NAKAMA!","#ffd93b");for(var k=0;k<8;k++)setTimeout(function(){burst(Math.random()*innerWidth,innerHeight*.55,28)},k*170)}

 // --- LIGHT VISION: spotlight lens that reveals hidden anime words ---
 var vb=$("vbtn"),lvt=$("lvt"),W2=["Believe it!","Tatakae!","Nakama","Dattebayo!","Go beyond!","Kamehameha!","Yare yare","Gomu gomu!","Never give up","Plus ultra!","\u26a1","\ud83c\udf65","\ud83d\udcab","\ud83d\udd25"];
